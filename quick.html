<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickView Carousel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
  
</head>
<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #f9f9f9;
}
.quick-view {
  padding: 15px 16px;
  background-color:rgb(211, 212, 213);
  position: relative;
  border-radius: 50px;
  margin: 20px auto;
  
}

.quick-view-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}

.quick-view-header h2 {
  color: black;
  font-size: 2rem;
  font-weight: bold;
  margin: 1.5rem;
  font-family: Georgia, serif;
}

.view-all {
  background: none;
  border: none;
  color: black;
  font-size: 1rem;
  display: flex;
  align-items: center;
  cursor: pointer;
}

.view-all .icon {
  width: 20px;
  height: 20px;
  margin-left: 4px;
}

.swiper-container {
  position: relative;
  padding-top: 5px;
  padding-bottom: 5px;
}

.swiper-slide {
  background-color: rgb(249, 235, 235);
  border-radius: 20px;
  overflow: hidden;
  transition: transform 0.3s ease;
}

.swiper-slide:hover {
  transform: scale(1.02);
}

.product-image {
  position: relative;
  aspect-ratio: 4/4;
  width: 100%;
  overflow: hidden;
  border-radius: 30px 20px 0 0;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product-image::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgb(7, 3, 3, 0.2);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.product-image:hover::after {
  opacity: 1;
}

.product-info {
  padding: 14px;
}

.product-info h3 {
  font-size: 1.2rem;
  font-weight: bold;
  margin: 0;
}

.product-info p {
  margin: 4px 0;
  color: #555;
  font-size: 0.9rem;
}

.product-info .price {
  font-size: 1.1rem;
  font-weight: bold;
}

.custom-nav {
  color: black;
  background-color: rgba(255, 255, 255, 0.8);
  height: 2rem; /* smaller height */
  width: 2rem; /* smaller width */
  border-radius: 50%;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  transition: background-color 0.3s;
  font-size: 1rem; /* smaller icon */
  display: flex;
  align-items: center;
  justify-content: center; /* center the icon */
  z-index: 10;
}

.custom-nav:hover {
  background-color: #fff;
}

.swiper-pagination {
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
  color: #fff;
  z-index: 10;
}
.swiper-pagination-bullet {
  width: 10px;
  height: 10px;
  background: black;
  opacity: 0.6;
  margin: 6px;
  margin-top: 15px;
}

.swiper-pagination-bullet-active {
  opacity: 1;
  background: #000;
}
.swiper-button-next::after,
.swiper-button-prev::after {
  font-size: 20px !important; /* Smaller arrow icon */
  font-weight: bold;
}
</style>
<body>

  <div class="quick-view">
    <div class="quick-view-header">
      <h2>QuickView</h2>
      <button class="view-all">
        View All
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="swiper-container swiper">
      <div class="swiper-wrapper" id="product-list">
        <!-- Product Slides injected via JS -->
      </div>

      <!-- Navigation -->
      <div class="swiper-button-prev custom-nav"></div>
      <div class="swiper-button-next custom-nav"></div>

      <!-- Pagination -->
      <div class="swiper-pagination"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
