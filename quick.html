<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickView Carousel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
  
</head>
<style>

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #f9f9f9;
}
.quick-view {
  padding: 5px 35px;
  
  position: relative;
  
  margin: 20px auto;
  
}

.quick-view-header {
  display: flex;
  justify-content: center;
  align-items: center;
  color: black;
  font-size: 3rem;
  font-weight: bold;
 margin: 10px;
  font-family: "Mier Book";
  padding: 8px;
  
}





.swiper-container {
  position: relative;
  padding-top: 5px;
  padding-bottom: 5px;
  
}

.swiper-slide {
  background-color: #cdcbcbff;
  border-radius: 20px;
  overflow: hidden;
  transition: transform 0.3s ease;
}

.swiper-slide:hover {
  transform: scale(1.02);
}

.product-image {
  position: relative;
  aspect-ratio: 4/4;
  width: 100%;
  overflow: hidden;
  border-radius: 30px 20px;
  
  
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product-image::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgb(7, 3, 3, 0.6);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.product-image:hover::after {
  opacity: 1;
}

.product-info {
  padding: 14px;
}

.product-info h3 {
  font-size: 1.2rem;
  font-weight: bold;
  margin: 0;
}

.product-info p {
  margin: 4px 0;
  color: black;
  font-size: 0.9rem;
}

.product-info .price {
  font-size: 1.1rem;
  font-weight: bold;
}

.custom-nav {
  color: black;
  background-color: rgba(255, 255, 255, 0.8);
  height: 2rem; /* smaller height */
  width: 2rem; /* smaller width */
  border-radius: 50%;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  transition: background-color 0.3s;
  font-size: 1rem; /* smaller icon */
  display: flex;
  align-items: center;
  justify-content: center; /* center the icon */
  z-index: 10;
}

.custom-nav:hover {
  background-color: #fff;
}

.swiper-pagination {
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
  color: #fff;
  z-index: 10;
}
.swiper-pagination-bullet {
  width: 10px;
  height: 10px;
  background: black;
  opacity: 0.6;
  margin: 6px;
  margin-top: 15px;
}

.swiper-pagination-bullet-active {
  opacity: 1;
  background: #000;
}
.swiper-button-next::after,
.swiper-button-prev::after {
  font-size: 20px !important; /* Smaller arrow icon */
  font-weight: bold;
}

@media (max-width: 610px) {
  .quick-view-header  {
    font-size: 2.3rem;
    margin: 1rem;
    text-align: center;
    margin-top: 10px;
  }

  .quick-view{
    margin: 1px auto;
  }

 
  
  .custom-nav {
    height: 1.5rem; /* even smaller height */
    width: 1.5rem; /* even smaller width */
    
  }
}
</style>
<body>

  <div class="quick-view">
    <div class="quick-view-header">
      <h2>QuickView</h2>
      
    </div>

    <div class="swiper-container swiper">
      <div class="swiper-wrapper" id="product-list">
        <!-- Product Slides injected via JS -->
      </div>

      <!-- Navigation -->
      <div class="swiper-button-prev custom-nav"></div>
      <div class="swiper-button-next custom-nav"></div>

      <!-- Pagination -->
      <div class="swiper-pagination"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
  <script >const quickViewButton = document.getElementById("quickViewButton");
  const products = [
  {
    id: 1,
    brand: 'MAYKR',
    category: 'Smart Casual Wear',
    price: 599,
    image: 'https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=400&h=600&fit=crop'
  },
  {
    id: 2,
    brand: 'ISHRANSH',
    category: "Women's Fancy Footwear",
    price: 499,
    image: 'https://images.unsplash.com/photo-1585487000143-9bcec9b8e483?w=400&h=600&fit=crop'
  },
  {
    id: 3,
    brand: 'FIT & FLARE',
    category: 'Designer Dresses',
    price: 799,
    image: 'https://images.unsplash.com/photo-1585487000160-6ebcfceb0d03?w=400&h=600&fit=crop'
  },
  {
    id: 4,
    brand: 'ETHNIC PLUS',
    category: 'Traditional Wear',
    price: 899,
    image: 'https://images.unsplash.com/photo-1594387303881-0c0bd29c0e10?w=400&h=600&fit=crop'
  },
  {
    id: 5,
    brand: 'URBAN STYLE',
    category: 'Casual Collection',
    price: 699,
    image: 'https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?w=400&h=600&fit=crop'
  },
  {
    id: 6,
    brand: 'LUXE WEAR',
    category: 'Premium Fashion',
    price: 999,
    image: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400&h=600&fit=crop'
  }
];

// Inject products
const productList = document.getElementById('product-list');

products.forEach(product => {
  const slide = document.createElement('div');
  slide.className = 'swiper-slide';
  slide.innerHTML = `
    <div class="product-image">
      <img src="${product.image}" alt="${product.brand}" />
    </div>
    <div class="product-info">
      <h3>${product.brand}</h3>
      <p>${product.category}</p>
      <p class="price">Under ₹${product.price}</p>
    </div>
  `;
  productList.appendChild(slide);
});

// Initialize Swiper
new Swiper('.swiper', {
  slidesPerView: 1.2,
  spaceBetween: 16,
  loop: true,
  autoplay: {
    delay: 2000,
    disableOnInteraction: false,
    pauseOnMouseEnter: true
  },
  pagination: {
    el: '.swiper-pagination',
    clickable: true,
    dynamicBullets: true
  },
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev'
  },
  breakpoints: {
    480: { slidesPerView: 1.5 },
    640: { slidesPerView: 2.2 },
    768: { slidesPerView: 2.5 },
    1024: { slidesPerView: 3.2 },
    1280: { slidesPerView: 4.2 }
  }
});
</script>
</body>
</html>
