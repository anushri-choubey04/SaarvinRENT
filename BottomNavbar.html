<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAARVIN</title>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
    />
    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: white;
        border-top: 2px solid rgb(222, 230, 246);
        height: 80px;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }

      .active-btn {
        background: none;
        border: none;
        outline: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 16px;
        color: #333;
        justify-content: center;
        text-align: center;
      }
      .active-btn:hover svg {
        color: #06c342; /* Highlight color on hover */
        transform: scale(1.1); /* Slight zoom */
        transition: all 0.2s ease;
      }

      .active-btn:hover span {
        color: #06c342;
        transition: color 0.2s ease;
      }

      .center-icon {
        background-color: rgb(186, 43, 48);
        border-radius: 50%;
        padding: 12px;
        margin-top: -24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .center-icon svg {
        color: white;
        align-self: center;
        justify-content: center;
      }

      .active-btn svg {
        color: #0d0102;
        align-self: center;
        justify-content: center;
      }

      svg {
        width: 24px;
        height: 24px;
        align-self: center;
        justify-content: center;
        display: flex;
      }
      .active-btn i {
        color: #0d0102;
        font-size: 24px;
        align-self: center;
        justify-content: center;
      }
    </style>
  </head>

  <nav class="bottom-nav">
    <button class="active-btn">
      <span
        ><a href="index.html"><i data-lucide="home"></i>Home </a></span
      >
    </button>

    <button class="active-btn">
      <span
        ><a href="shop.html"><i data-lucide="search"></i>Rent </a></span
      >
    </button>
    <button>
      <div class="center-icon">
        <i data-lucide="plus-circle" style="color: white"></i>
      </div>
      <span style="margin-top: 4px">Feed</span>
    </button>
    <button class="active-btn">
      <span
        ><a href="ProductSection/bottomICON.html"
          ><i data-lucide="grid"></i>Categories
        </a></span
      >
    </button>

    <button class="active-btn">
      <span
        ><a href="wishlist.html"><i data-lucide="heart"></i>Wishlist</a></span
      >
    </button>
  </nav>
</html>
