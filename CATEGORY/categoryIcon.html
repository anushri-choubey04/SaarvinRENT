<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rental Categories</title>
    <style>
      /* 🌸 Base Setup */
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: white;
        color: #222;
      }

      section {
        max-width: 1200px;
        margin: 0 auto;
        padding: 60px 20px;
      }
      .categories{
        padding: 15px 10px;
      }

      .category-head {
        text-align: center;
        font-size: 3rem;
        font-weight: 700;
        color: #111;
        margin-bottom: 20px;
        padding: 10px;
      }

      /* 🌸 Horizontal Scroll Container */
      .categories-scroll {
        display: flex;
        gap: 20px;
        overflow-x: auto;
        scroll-behavior: smooth;
        padding-bottom: 10px;
        scrollbar-width: none; /* Firefox */
      }

      .categories-scroll::-webkit-scrollbar {
        display: none; /* Chrome, Safari */
      }

      /* 🌸 Card Style */
      .category-card {
        min-width: 160px;
        background: #cacdceff;
        border-radius: 16px;
        flex-shrink: 0;
        text-align: center;
        padding: 20px 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        position: relative;
      }

      .category-card:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      }

      /* 🌸 Icon Circle */
      .icon-circle {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        background: linear-gradient(to right, #107895, #76afce);
        color: white;
        transition: transform 0.3s ease;
      }

      .category-card:hover .icon-circle {
        transform: rotate(10deg) scale(1.1);
      }

      /* 🌸 Image Icon */
      .category-card img {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      /* 🌸 Text */
      .category-card h3 {
        font-size: 0.95rem;
        font-weight: 600;
        color: #222;
        margin-bottom: 4px;
      }

      .category-card p {
        font-size: 0.85rem;
        color: #666;
        margin-bottom: 8px;
      }

      /* 🌸 Button */
      .explore-btn {
        display: inline-block;
        padding: 6px 14px;
        font-size: 0.75rem;
        background: linear-gradient(to right, #107895, #76afce);
        color: #fff;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.3s ease;
      }

      .explore-btn:hover {
        background: linear-gradient(to right, #353434, #7e7578);
      }

      /* 🌸 Responsive Tweaks */
      @media (max-width: 768px) {
        .category-head {
          font-size: 1.6rem;
          margin: 10px;
          padding: 15px 10px;
        }

        .category-card {
          min-width: 140px;
          padding: 15px;
        }

        .icon-circle,
        .category-card img {
          width: 60px;
          height: 60px;
        }

        .category-card h3 {
          font-size: 0.85rem;
        }

        .category-card p {
          font-size: 0.8rem;
        }
        .categories-scroll {
          display: flex;
          gap: 20px;
          overflow-x: auto;
          scroll-behavior: smooth;
          padding-bottom: 10px;

          scrollbar-width: none;
        }
      }
    </style>
  </head>

  <body>
    <section class="categories">
      <h2 class="category-head">Rent by Occasion</h2>

      <div class="categories-scroll">
        <div class="category-card">
          <div class="icon-circle">🎓</div>
          <h3>Graduation</h3>
          <p>120+ Outfits</p>
          <a href="#" class="explore-btn">Rent Now</a>
        </div>

        <div class="category-card">
          <div class="icon-circle">💼</div>
          <h3>Office Event</h3>
          <p>180+ Styles</p>
          <a href="#" class="explore-btn">Rent Now</a>
        </div>

        <div class="category-card">
          <div class="icon-circle">🍷</div>
          <h3>Party Wear</h3>
          <p>250+ Dresses</p>
          <a href="#" class="explore-btn">Rent Now</a>
        </div>

        <div class="category-card">
          <div class="icon-circle">👗</div>
          <h3>Ethnic Wear</h3>
          <p>300+ Collections</p>
          <a href="#" class="explore-btn">Rent Now</a>
        </div>

        <div class="category-card">
          <div class="icon-circle">📸</div>
          <h3>Pre-Wedding</h3>
          <p>150+ Looks</p>
          <a href="#" class="explore-btn">Rent Now</a>
        </div>

        <div class="category-card">
          <div class="icon-circle">💍</div>
          <h3>Wedding Guest</h3>
          <p>200+ Outfits</p>
          <a href="#" class="explore-btn">Rent Now</a>
        </div>

        <div class="category-card">
          <img src="images/table.jpeg" alt="Date Night" />
          <h3>Date Night</h3>
          <p>400+ Dresses</p>
          <a href="#" class="explore-btn">Rent Now</a>
        </div>
      </div>
    </section>
  </body>
</html>
