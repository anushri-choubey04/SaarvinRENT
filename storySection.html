<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAARVIN</title>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
    />
    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Story Section -->
    <div class="px-3 py-3">
      <div
        id="stories-strip"
        class="flex gap-4 overflow-x-auto hide-scrollbar"
      ></div>
    </div>

    <div
      id="story-viewer"
      class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center"
    >
      <div
        class="relative w-full max-w-[500px] h-screen bg-black"
        id="viewer-container"
      >
        <div
          id="progress-bars"
          class="absolute top-0 left-0 right-0 z-20 flex gap-1 p-2"
        ></div>
        <div
          class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between p-4 pt-6"
        >
          <div class="flex items-center gap-2">
            <img id="profile-pic" class="w-10 h-10 rounded-full object-cover" />
            <div>
              <h3 id="username" class="text-black font-semibold text-lg"></h3>
              <p id="timestamp" class="text-black/80 text-lg"></p>
            </div>
          </div>
          <button onclick="closeViewer()" class="text-white p-2">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div id="story-content" class="h-full w-full relative"></div>

        <div
          id="caption"
          class="absolute bottom-20 left-0 right-0 p-4 text-white text-center text-lg font-medium"
        ></div>

        <div
          id="swipe-up"
          class="absolute bottom-20 left-0 right-0 flex flex-col items-center text-white hidden"
        >
          <svg
            class="w-6 h-6 animate-bounce"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 15l7-7 7 7"
            />
          </svg>
          <span class="text-sm">Swipe up to see more</span>
        </div>

        <div
          class="absolute bottom-0 left-0 right-0 p-4 flex items-center gap-4"
        >
          <input
            type="text"
            placeholder="Send message"
            class="flex-1 bg-white/10 text-white rounded-full px-4 py-2 text-sm placeholder-white/60"
          />
          <div class="flex gap-2 text-white">❤️</div>
        </div>
      </div>
    </div>
  </body>
  <script>
    const stories = [
    {
      id: 1,
      type: "form",
      username: "List Your Clothes",
      image: null,
      formLink: "HTML/ListingForm.html",
    },
    {
      id: 2,
      username: "Wedding Collection",
      profilePic:
        "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80",
      media: [
        {
          type: "image",
          url: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80",
          caption: "Discover our latest bridal collection",
        },
      ],
      timestamp: "2h",
      hasSwipeUp: true,
    },
    {
      id: 3,
      username: "Men's Wear",
      profilePic:
        "https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?w=150&h=150&fit=crop",
      media: [
        {
          type: "image",
          url: "https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?w=1080&h=1920&fit=crop",
          caption: "Premium suits for every occasion",
        },
      ],
      timestamp: "3h",
    },
  ];
  
  let currentStoryIndex = 0;
  let currentMediaIndex = 0;
  let isPaused = false;
  let progressInterval;
  
  const storiesContainer = document.getElementById("storiesContainer");
  const modal = document.getElementById("listingForm");
  const overlay = document.getElementById("modalOverlay");
  const storyViewer = document.getElementById("story-viewer");
  const storiesStrip = document.getElementById("stories-strip");
  const profilePic = document.getElementById("profile-pic");
  const username = document.getElementById("username");
  const timestamp = document.getElementById("timestamp");
  const storyContent = document.getElementById("story-content");
  const caption = document.getElementById("caption");
  const swipeUp = document.getElementById("swipe-up");
  const progressBars = document.getElementById("progress-bars");
  
  
  function openModal() {
    modal.classList.remove("hidden");
    overlay.classList.remove("hidden");
  }
  
  function closeModal() {
    modal.classList.add("hidden");
    overlay.classList.add("hidden");
  }
  
  function createStoryIcons() {
    stories.forEach((story, index) => {
      const btn = document.createElement("button");
      btn.className = "flex flex-col items-center flex-shrink-0";
      btn.innerHTML = `
          <div class="w-16 h-16 rounded-full border-2 border-[#8D1C23] p-0.5 mb-1">
            <img src="${story.profilePic}" class="w-full h-full rounded-full object-cover" />
          </div>
          <span class="text-lg text-center whitespace-nowrap">${story.username}</span>
        `;
      btn.addEventListener("click", () => openViewer(index));
      storiesStrip.appendChild(btn);
    });
  }
  
  function openViewer(index) {
    currentStoryIndex = index;
    currentMediaIndex = 0;
    storyViewer.classList.remove("hidden");
    loadStory();
  }
  
  function closeViewer() {
    storyViewer.classList.add("hidden");
    clearInterval(progressInterval);
  }
  
  
  function loadStory() {
    const story = stories[currentStoryIndex];
    const media = story.media[currentMediaIndex];
  
    profilePic.src = story.profilePic;
    username.textContent = story.username;
    timestamp.textContent = story.timestamp;
    caption.textContent = media.caption || "";
    swipeUp.style.display = story.hasSwipeUp ? "flex" : "none";
  
    storyContent.innerHTML = `
        <img src="${media.url}" class="w-full h-full object-cover absolute inset-0" />
      `;
  
    loadProgressBar(story.media.length);
    startProgress();
  }
  
  function loadProgressBar(count) {
    progressBars.innerHTML = "";
    for (let i = 0; i < count; i++) {
      const bar = document.createElement("div");
      bar.className = "h-0.5 flex-1 bg-white/30 overflow-hidden";
      if (i === currentMediaIndex) {
        const fill = document.createElement("div");
        fill.className = "h-full bg-white";
        fill.id = "active-progress";
        fill.style.width = "0%";
        bar.appendChild(fill);
      }
      progressBars.appendChild(bar);
    }
  }
  
  function startProgress() {
    let progress = 0;
    clearInterval(progressInterval);
    const activeProgress = document.getElementById("active-progress");
  
    progressInterval = setInterval(() => {
      if (!isPaused) {
        progress += 1;
        if (activeProgress) activeProgress.style.width = `${progress}%`;
        if (progress >= 100) {
          nextMedia();
        }
      }
    }, 50);
  }
  
  function nextMedia() {
    const story = stories[currentStoryIndex];
    if (currentMediaIndex < story.media.length - 1) {
      currentMediaIndex++;
    } else if (currentStoryIndex < stories.length - 1) {
      currentStoryIndex++;
      currentMediaIndex = 0;
    } else {
      closeViewer();
      return;
    }
    loadStory();
  }
  
  function previousMedia() {
    if (currentMediaIndex > 0) {
      currentMediaIndex--;
    } else if (currentStoryIndex > 0) {
      currentStoryIndex--;
      currentMediaIndex = stories[currentStoryIndex].media.length - 1;
    }
    loadStory();
  }
      
  
  // Touch navigation
  storyContent.addEventListener("touchstart", (e) => {
    const x = e.touches[0].clientX;
    const width = storyContent.offsetWidth;
    if (x < width * 0.25) {
      previousMedia();
    } else if (x > width * 0.75) {
      nextMedia();
    }
  });
  
  // Long press to pause
  let touchTimer;
  storyContent.addEventListener("touchstart", () => {
    touchTimer = setTimeout(() => {
      isPaused = true;
    }, 200);
  });
  storyContent.addEventListener("touchend", () => {
    clearTimeout(touchTimer);
    isPaused = false;
  });
  
  createStoryIcons();
  </script>
</html>
