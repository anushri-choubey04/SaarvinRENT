<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAARVIN</title>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
    />
    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />

    <style>
      .hide-scrollbar::-webkit-scrollbar {
  display: none;
}
.hide-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* ===== Moving Headline Above Stories ===== */
@media (max-width: 768px) {
  .moving-headline {
    position: relative;
    gap: 3.5rem;
    overflow: hidden;
    white-space: nowrap;
    background: black;
    padding: 10px 0;
  }

  .moving-headline p {
    display: flex;
    font-weight: 600;
    font-size: 14px;
    gap: 3.5rem;
    letter-spacing: 1px;
    color: white;
    animation: marquee 15s linear infinite;
  }

  /* Create continuous infinite effect */
  @keyframes marquee {
    0% {
      transform: translateX(100%);
    }
    100% {
      transform: translateX(-100%);
    }
  }
}
/* ===== Rest of Story Section (same as before) ===== */
.story-section {
  background: #ffffff;
  border-bottom: 1px solid #f0f0f0;
  font-family: "Inter", sans-serif;
}

/* Horizontal scroll setup */
.stories-container {
  display: flex;
  flex-direction: row;
  gap: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 12px 8px;
  scroll-behavior: smooth;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
}

.stories-container::-webkit-scrollbar {
  display: none;
}
.stories-container {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* Each story card */
.story {
  flex: 0 0 auto;
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.story:hover {
  transform: translateY(-3px);
}

/* Avatar circle */
.story-avatar {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: 2.5px solid transparent;
  background: linear-gradient(45deg, #0e0d0dff, #f97316);
  padding: 2px;
  margin: 0 auto;
  position: relative;
}

.story-avatar::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: #fff;
  z-index: 0;
}

.story-avatar img,
.story-avatar i {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.story-avatar i {
  color: black;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Info below avatar */
.story-info {
  margin-top: 6px;
}

.story-username {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: #111;
  gap: 2rem;
  white-space: nowrap;
  overflow: hidden;
}

.story-time {
  display: block;
  font-size: 10px;
  color: #999;
}

/* Add Story special style */
.add-story .story-avatar {
  background: #f3f3f3;
  border: 2px dashed #726c6fff;
}

.add-story i {
  color: black;
  font-size: 22px;
}

/* Divider line below */
.story-section::after {
  content: "";
  display: block;
  height: 1px;
  background: linear-gradient(to right, #eee, transparent);
  margin-top: 10px;
}

    </style>
  </head>

   <section class="story-section md:hidden md:mt-10">
  <!-- Moving Headline -->
  <div class="moving-headline">
    <p>
      <span>✨ Share Your Style</span>
      <span>• List Your Clothes</span>
      <span>• Explore Trending Looks ✨</span>
    </p>
  </div>

  <div class="stories-container">
    <!-- Fixed Add Story Cards -->
    <div class="story" data-story-id="1">
      <div class="story-avatar">
        <i class="fas fa-plus"></i>
      </div>
      <div class="story-info">
        <span class="story-username">List Your Clothes</span>
      </div>
    </div>

    <div class="story" data-story-id="2">
      <div class="story-avatar">
        <i class="fas fa-plus"></i>
      </div>
      <div class="story-info">
        <span class="story-username">Add Your Story</span>
      </div>
    </div>

    <!-- Dynamic Stories -->
    {% for story in stories %}
    <div class="story" data-story-id="{{ story.id }}">
      <div class="story-avatar">
        {% if story.user.profile_picture %}
        <img
          src="{{ story.user.profile_picture.url }}"
          alt="{{ story.user.username }}"
        />
        {% else %}
        <i class="fas fa-user"></i>
        {% endif %}
      </div>
      <div class="story-info">
        <span class="story-username">{{ story.user.username }}</span>
        <span class="story-time">{{ story.created_at|timesince }} ago</span>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
</html>
