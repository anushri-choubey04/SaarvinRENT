<!-- Tabs Navigation -->
<div class="tabs-nav">
  <a href="rent.html" class="tab-link">How to Rent</a>
  <a href="lend.html" class="tab-link">How to Lend</a>
  <a href="delivery.html" class="tab-link">How Delivery Works</a>
</div>

<style>
  .tabs-nav {
    display: flex;
    justify-content: center;
    background: #f5f5f5;
    border-radius: 50px;
    margin: 20px auto;
    padding: 10px;
    max-width: 600px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .tab-link {
    flex: 1;
    text-align: center;
    padding: 12px 20px;
    margin: 0 5px;
    border-radius: 50px;
    font-weight: bold;
    font-size: 1rem;
    color: #333;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .tab-link:hover {
    background: #000;
    color: #fff;
  }

  .tab-link.active {
    background: #000;
    color: #fff;
    transform: scale(1.05);
  }
</style>

<script>
  // Highlight active tab
  const currentPage = window.location.pathname.split("/").pop();
  document.querySelectorAll(".tab-link").forEach(link => {
    if(link.getAttribute("href") === currentPage){
      link.classList.add("active");
    }
  });
</script>
