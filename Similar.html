<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Similar Items - Rental Clothing</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --primary: #0b0464;
    --secondary: #d9c7ff;
    --accent: #ff7f50;
    --text-dark: #1a1a1a;
    --text-light: #555;
    --bg-light: #faf8ff;
  }

  body {
    font-family: "Poppins", sans-serif;
    background: #f9f8ff;
    margin: 0;
    padding: 40px 20px;
    color: var(--text-dark);
    display: flex;
    justify-content: center;
  }

  .similar-section {
    font-family: "Poppins", sans-serif;
    background: #fff;
    border-radius: 24px;
    padding: 35px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.07);
    border: 1px solid #f1eefb;
    max-width: 1100px;
    width: 100%;
  }

  .similar-section h2 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 25px;
    color: var(--text-dark);
  }

  /* Horizontal layout */
  .similar-items {
    display: flex;
    gap: 25px;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding-bottom: 10px;
  }

  .similar-items::-webkit-scrollbar {
    height: 8px;
  }
  .similar-items::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 10px;
  }

  .item-card {
    flex: 0 0 250px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
    border: 1px solid #eee;
  }

  .item-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
  }

  .item-img {
    position: relative;
    width: 100%;
    height: 300px;
    border-radius: 16px 16px 0 0;
    overflow: hidden;
  }

  .item-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }

  .item-card:hover img {
    transform: scale(1.05);
  }

  .item-content {
    padding: 15px;
    text-align: center;
  }

  .item-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-dark);
    margin: 8px 0;
  }

  .item-price {
    color: var(--primary);
    font-weight: 500;
    font-size: 0.95rem;
  }

  .rent-btn {
    margin-top: 10px;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.3s;
  }

  .rent-btn:hover {
    background: #150a8f;
  }

  @media (max-width: 768px) {
    .item-card {
      flex: 0 0 75%;
      min-width: 250px;
    }

    .item-img {
      height: 250px;
    }
  }
</style>
</head>
<body>

  <div class="similar-section">
    <h2>Similar Items </h2>

    <div class="similar-items">
      <div class="item-card">
        <div class="item-img">
          <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80" alt="Dress 1">
        </div>
        <div class="item-content">
          <h3 class="item-title">Luna Satin Gown</h3>
          <p class="item-price">Rent ₹999 / 48 hrs</p>
          <button class="rent-btn">Rent Now</button>
        </div>
      </div>

      <div class="item-card">
        <div class="item-img">
          <img src="https://images.unsplash.com/photo-1555529669-08f70346315a?auto=format&fit=crop&w=800&q=80" alt="Dress 2">
        </div>
        <div class="item-content">
          <h3 class="item-title">Amara Maxi Dress</h3>
          <p class="item-price">Rent ₹899 / 48 hrs</p>
          <button class="rent-btn">Rent Now</button>
        </div>
      </div>

      <div class="item-card">
        <div class="item-img">
          <img src="https://images.unsplash.com/photo-1556906781-9a412961c28c?auto=format&fit=crop&w=800&q=80" alt="Dress 3">
        </div>
        <div class="item-content">
          <h3 class="item-title">Celeste Party Wear</h3>
          <p class="item-price">Rent ₹1099 / 48 hrs</p>
          <button class="rent-btn">Rent Now</button>
        </div>
      </div>

      <div class="item-card">
        <div class="item-img">
          <img src="https://images.unsplash.com/photo-1586078130702-d208859b6223?auto=format&fit=crop&w=800&q=80" alt="Dress 4">
        </div>
        <div class="item-content">
          <h3 class="item-title">Chloe Evening Dress</h3>
          <p class="item-price">Rent ₹1199 / 48 hrs</p>
          <button class="rent-btn">Rent Now</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
