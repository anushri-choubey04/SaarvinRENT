<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
    />
    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <title>location</title>
  </head>
  <!-- ye section sirf small screen m show hoga  -->
  <body>
    <div class="container-location">
      <section
        class="bg-black rounded-xl max-w-sm mx-auto text-center my-9 px-8 py-8  block md:hidden"
        id="store-location"
      >
        <!-- Store Icon -->
        <div class="flex justify-center mb-4">
          <img src="store.png" alt="Store Icon" class="w-16 h-16" />
        </div>

        <!-- Heading -->
        <h2
          class="text-2xl font-bold text-white hover:text-blue-600 dark:hover:text-blue-400"
        >
          Visit our store
        </h2>

        <!-- Description -->
        <p class="text-white mt-2 mb-6 text-sm leading-relaxed">
          Walk-in to our store for the services <br />
          Laundry , Give and borrow clothes in rent.
        </p>

        <!-- Video  -->
        <div class="rounded-lg overflow-hidden shadow-md">
          <video controls class="w-full h-80 object-cover">
            <source src="saarvin.mp4" type="video/mp4" />
          </video>
        </div>
      </section>
    </div>
  </body>
</html>
